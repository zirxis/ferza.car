<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferza Car | Showroom Contact</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #141414;
            --accent-red: #e50914;
            --text-silver: #cfcfcf;
            --pure-white: #ffffff;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-silver);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        /* Background Graphic Elements */
        body::before {
            content: '';
            position: absolute;
            top: -10%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(229,9,20,0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
        }

        /* Header / Logo Section */
        header {
            text-align: center;
            padding: 40px 20px 20px 20px;
            animation: fadeInDown 1s ease;
        }

        .logo-container img {
            max-width: 280px;
            height: auto;
            filter: drop-shadow(0px 4px 20px rgba(229, 9, 20, 0.3));
            transition: var(--transition);
        }

        .logo-container img:hover {
            transform: scale(1.03);
        }

        /* Main Container */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            align-items: start;
            animation: fadeIn 1.2s ease;
            width: 100%;
        }

        /* Info Cards */
        .info-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid #222;
            border-radius: 12px;
            padding: 30px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-red);
            transform: scaleY(0);
            transition: var(--transition);
            transform-origin: bottom;
        }

        .card:hover::before {
            transform: scaleY(1);
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #333;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .card h2 {
            color: var(--pure-white);
            font-size: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card h2 i {
            color: var(--accent-red);
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 15px;
        }

        .contact-item:last-child {
            margin-bottom: 0;
        }

        .contact-item a {
            color: var(--text-silver);
            text-decoration: none;
            transition: var(--transition);
        }

        .contact-item a:hover {
            color: var(--pure-white);
            padding-left: 5px;
        }

        /* --- تعديل أيقونات التواصل الاجتماعي فقط --- */
        .social-icons {
            display: flex;
            gap: 20px; /* زيادة المسافة بين الدوائر */
            margin-top: 10px;
        }

        .social-icons a {
            width: 55px; /* تكبير الدائرة الخرجية */
            height: 55px; /* تكبير الدائرة الخارجية */
            border-radius: 50%;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-silver);
            text-decoration: none;
            transition: var(--transition);
        }

        /* تكبير حجم الأيقونة نفسها بالداخل */
        .social-icons a i {
            font-size: 1.8em; 
        }

        .social-icons a:hover {
            background: var(--accent-red);
            color: var(--pure-white);
            transform: translateY(-3px);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 20px;
            font-size: 12px;
            letter-spacing: 1px;
            color: #555;
            border-top: 1px solid #111;
            width: 100%;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="logo.jpg" alt="Ferza Car Logo">
        </div>
    </header>

    <div class="container">
        <div class="info-section">
            <div class="card">
                <h2><i class="fa-solid fa-address-book"></i> Direct Contact</h2>
                <div class="contact-item">
                    <i class="fa-solid fa-phone" style="color: var(--accent-red);"></i>
                    <a href="tel:0671589117">0671589117</a>
                </div>
                <div class="contact-item">
                    <i class="fa-solid fa-envelope" style="color: var(--accent-red);"></i>
                    <a href="mailto:Abdoullahmessaoudi6@gmail.com">Abdoullahmessaoudi6@gmail.com</a>
                </div>
            </div>

            <div class="card">
                <h2><i class="fa-solid fa-share-nodes"></i> Follow the Ride</h2>
                <div class="social-icons">
                    <a href="https://www.instagram.com/ferza_car" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                    <a href="https://www.facebook.com/profile.php?id=61589110509224&rdid=ZexGQVb2MQOWk6OO&share_url=https%3A%2F%2Fwww.facebook.com%2Fshare%2F1U9DxY8L2Y%2F#" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="https://www.tiktok.com/@ferza_car" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Ferza Car. All Rights Reserved. Crafted for Performance.
    </footer>

</body>
</html>
