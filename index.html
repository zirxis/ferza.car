<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferza Car | Showroom Contact</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f7f9fa;       /* خلفية الصفحة الفاتحة */
            --card-bg: #ffffff;        /* خلفية الكارد البيضاء */
            --border-color: #e1e8ed;   /* لون الحدود الفاتح */
            --accent-red: #e50914;     /* اللون الأحمر المميز للتفاعل */
            --text-dark: #1a1a1a;       /* لون النص الأساسي الداكن */
            --text-muted: #657786;     /* لون النص الفرعي */
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Background Graphic Elements - تم تعديلها لتناسب الخلفية الفاتحة */
        body::before {
            content: '';
            position: absolute;
            top: -10%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(229,9,20,0.06) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
        }

        /* Main Container */
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            animation: fadeIn 1.2s ease;
            width: 100%;
        }

        /* Social Icons Section */
        .social-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* شكل الكارد الفاتح الجديد */
        .social-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-decoration: none;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.03);
            transition: var(--transition);
        }

        /* تأثير الخط الأحمر الجانبي عند التمرير */
        .social-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-red);
            transform: scaleY(0);
            transition: var(--transition);
            transform-origin: bottom;
        }

        .social-card:hover::before {
            transform: scaleY(1);
        }

        .social-card:hover {
            transform: translateY(-5px);
            border-color: #ccd6dd;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            color: var(--text-dark);
        }

        /* حجم الأيقونات داخل الكارد وتغيير لونها عند التمرير */
        .social-card i {
            font-size: 2.5em;
            transition: var(--transition);
        }

        .social-card:hover i {
            color: var(--accent-red);
            transform: scale(1.1);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 20px;
            font-size: 12px;
            letter-spacing: 1px;
            color: #8898a5;
            width: 100%;
            position: absolute;
            bottom: 0;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="social-section">
            <a href="https://www.instagram.com/ferza_car" target="_blank" class="social-card">
                <i class="fa-brands fa-instagram"></i>
            </a>

            <a href="https://www.facebook.com/profile.php?id=61589110509224&rdid=ZexGQVb2MQOWk6OO&share_url=https%3A%2F%2Fwww.facebook.com%2Fshare%2F1U9DxY8L2Y%2F#" target="_blank" class="social-card">
                <i class="fa-brands fa-facebook-f"></i>
            </a>

            <a href="https://www.tiktok.com/@ferza_car" target="_blank" class="social-card">
                <i class="fa-brands fa-tiktok"></i>
            </a>
        </div>
    </div>

    <footer>
        &copy; 2026 Ferza Car. All Rights Reserved. Crafted for Performance.
    </footer>

</body>
</html>
